<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="job-state-machine-title job-state-machine-desc">
<title id="job-state-machine-title">Seven steps to done, two ways out</title>
<desc id="job-state-machine-desc">State machine for an analysis job: queued, validating, retrieving_data, processing_satellite, verifying_evidence, generating_report, completed; any active state can move to failed on error or timeout, or to cancelled on user request.</desc>
