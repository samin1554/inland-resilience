<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cache-schema-title cache-schema-desc">
<title id="cache-schema-title">What the pipeline remembers</title>
<desc id="cache-schema-desc">Cache schema: each provider_fetches row records one scheduled or live fetch and whether it is the last good one for its cache key; cached_evidence holds that fetch&#x27;s normalized items and is deleted with it; reference_layers stores versioned reference geometry such as the county boundary and historical perimeters.</desc>
