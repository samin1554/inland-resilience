  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --accent:#eb6c36; --link:#2e5aa8;
      --sans:'Geist', system-ui, sans-serif; --serif:'Instrument Serif','Noto Serif',serif; --mono:'Geist Mono', ui-monospace, monospace; }
    body { font-family: var(--sans); background: var(--paper); color: var(--ink); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--mono); font-size: .66rem; font-weight: 500; letter-spacing: .18em;
      text-transform: uppercase; color: var(--muted); margin-bottom: .5rem; }
    h1 { font-family: var(--serif); font-size: clamp(1.5rem, 2.4vw + .75rem, 2rem); font-weight: 400;
      letter-spacing: -.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    .note { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--muted); margin-top: 1rem; }
    .cards { display: grid; gap: 12px; margin-top: 1.5rem; }
    .card { background: #fff; border: 1px solid rgba(45,49,66,.12); border-radius: 6px; padding: 1.1rem 1.25rem; }
    .card .eyebrow { font-size: .6rem; margin-bottom: .4rem; }
    .card h3 { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; margin-bottom: .35rem; }
    .card p { font-size: 13px; color: var(--muted); line-height: 1.45; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot.ink { background: var(--ink); } .dot.muted { background: var(--muted); }
    .dot.coral { background: var(--accent); } .dot.link { background: var(--link); } .dot.soft { background: var(--soft); }
    footer { font-family: var(--mono); font-size: 10px; color: var(--soft); border-top: 1px solid rgba(45,49,66,.12);
      margin-top: 2rem; padding-top: .75rem; letter-spacing: .04em; }
  </style>
